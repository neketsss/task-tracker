{% extends 'base.html' %}
{% block title%}
Список задач
{% endblock %}
{% block content %}
<h2>Список задач</h2>
<button class="btn btn-primary mb-3" onclick="window.location.href='{% url 'task_create' %}'">Створити задачу</button>
<div class="list-group">
    {% for task in tasks %}
        <a href="#" class="list-group-item list-group-item-action">{{ task.title }}</a>
    {% endfor %}
</div>
{% endblock %}
