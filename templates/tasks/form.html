{% extends 'base.html' %}
{% block title %}
Створення задачі
{% endblock %}

{% block content %}
<h2>Створення задачі</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    {% if object %}
        <button type="submit" class="btn btn-primary">Зберегти</button>
    {% else %}
        <button type="submit" class="btn btn-primary">Створити</button>
    {% endif %}
</form>
{% endblock %}
